<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>潮旅國際旅行社 — 管理後台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
/* ── 全域 ── */
:root {
  --blue:#1a6b9e; --blue-dk:#0d4f7c; --sand:#f5ede0;
  --white:#fff; --mid:#4a5568; --light:#f7fafc;
  --red:#e53e3e; --green:#38a169; --orange:#dd6b20;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
     background:#f0f4f8;color:#2d3748;font-size:14px}
a{text-decoration:none;color:inherit}
/* ── 上方 Header ── */
.admin-header{
  background:linear-gradient(90deg,var(--blue-dk),var(--blue));
  color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2)
}
.admin-header h1{font-size:1.05rem;font-weight:800;display:flex;gap:8px;align-items:center}
.header-actions{display:flex;gap:8px;align-items:center}
.header-tag{font-size:.75rem;opacity:.7;background:rgba(255,255,255,.15);
  padding:2px 10px;border-radius:20px}
/* ── Tab 導覽 ── */
.tab-nav{background:#fff;border-bottom:2px solid #e2e8f0;
  display:flex;padding:0 24px;gap:4px}
.tab-nav button{padding:12px 20px;border:none;background:none;cursor:pointer;
  font-weight:600;color:var(--mid);border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:.2s}
.tab-nav button.active{color:var(--blue);border-bottom-color:var(--blue)}
/* ── 主內容 ── */
.admin-body{max-width:1200px;margin:0 auto;padding:24px}
.tab-content{display:none}.tab-content.active{display:block}
/* ── 工具列 ── */
.toolbar{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar h2{font-size:1.1rem;font-weight:700;color:var(--blue-dk)}
.toolbar-right{display:flex;gap:8px;align-items:center}
/* ── 按鈕 ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;
  border:none;transition:.2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dk)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-warning{background:var(--orange);color:#fff}
.btn-warning:hover{opacity:.85}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{opacity:.85}
.btn-ghost{background:#e2e8f0;color:var(--mid)}
.btn-ghost:hover{background:#cbd5e0}
.btn-sm{padding:5px 10px;font-size:.78rem}
/* ── 行程列表 Table ── */
.tour-table{width:100%;border-collapse:collapse;background:#fff;
  border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.tour-table th{background:var(--blue-dk);color:#fff;padding:10px 14px;
  text-align:left;font-size:.82rem;font-weight:700}
.tour-table td{padding:10px 14px;border-bottom:1px solid #edf2f7;
  vertical-align:middle}
.tour-table tr:last-child td{border-bottom:none}
.tour-table tr:hover td{background:#f7fafc}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;
  font-size:.72rem;font-weight:700}
.badge-active{background:#c6f6d5;color:#276749}
/* ── 前台顯示開關 ── */
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle-wrap input[type=checkbox]{display:none}
.toggle-track{
  width:42px;height:22px;border-radius:11px;background:#cbd5e0;
  position:relative;transition:.25s;flex-shrink:0
}
.toggle-track::after{
  content:'';position:absolute;top:3px;left:3px;
  width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.25s
}
input:checked + .toggle-track{background:var(--green)}
input:checked + .toggle-track::after{transform:translateX(20px)}
.toggle-label{font-size:.78rem;font-weight:600;color:var(--mid);min-width:28px}
.toggle-wrap:hover .toggle-track{opacity:.85}
.badge-inactive{background:#fed7d7;color:#9b2c2c}
.tab-chip{display:inline-block;background:#ebf8ff;color:#2b6cb0;
  border-radius:12px;padding:2px 8px;font-size:.72rem;margin:2px}
.drag-handle{cursor:grab;color:#cbd5e0;padding:0 4px}
/* ── 卡片 (諮詢列表) ── */
.contact-card{background:#fff;border-radius:10px;padding:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.contact-field label{font-size:.72rem;color:var(--mid);display:block;margin-bottom:2px}
.contact-field span{font-weight:600;font-size:.88rem}
/* ── Modal 彈窗 ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:16px;width:min(780px,96vw);
  max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{background:linear-gradient(135deg,var(--blue-dk),var(--blue));
  color:#fff;padding:20px 24px;border-radius:16px 16px 0 0;
  display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:1.1rem}
.modal-body-inner{padding:24px}
/* ── 表單 ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.82rem;font-weight:700;color:var(--blue-dk)}
.form-group input,.form-group select,.form-group textarea{
  padding:9px 12px;border:2px solid #e2e8f0;border-radius:8px;
  font-size:.9rem;font-family:inherit;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--blue)}
.form-group textarea{min-height:80px;resize:vertical}
.form-section{margin:16px 0 8px;font-size:.85rem;font-weight:800;
  color:var(--blue-dk);border-bottom:2px solid #e2e8f0;padding-bottom:4px}
/* ── Tab 勾選 ── */
.checkbox-group{display:flex;gap:12px;flex-wrap:wrap}
.checkbox-label{display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:.88rem;font-weight:600}
.checkbox-label input{width:16px;height:16px;cursor:pointer}
/* ── Prices 多行 ── */
.price-rows{display:flex;flex-direction:column;gap:6px}
.price-row-input{display:flex;gap:6px;align-items:center}
.price-row-input input{flex:1}
.price-row-input button{flex-shrink:0}
/* ── 圖片預覽 ── */
.img-preview{width:100%;height:140px;object-fit:cover;border-radius:8px;
  border:2px solid #e2e8f0;margin-top:6px;display:none}
/* ── 通知 Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:#2d3748;color:#fff;
  padding:12px 20px;border-radius:10px;font-size:.9rem;z-index:999;
  opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
/* ── 登入畫面 ── */
.login-screen{display:flex;min-height:100vh;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#0d4f7c,#1a6b9e)}
.login-box{background:#fff;border-radius:20px;padding:40px;
  width:min(400px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-box h2{font-size:1.4rem;font-weight:800;color:var(--blue-dk);margin-bottom:6px}
.login-box p{color:var(--mid);margin-bottom:24px;font-size:.9rem}
.login-input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;
  border-radius:10px;font-size:1rem;margin-bottom:12px;outline:none}
.login-input:focus{border-color:var(--blue)}
/* ── 統計卡 ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;
  box-shadow:0 1px 6px rgba(0,0,0,.08);text-align:center}
.stat-card .num{font-size:2rem;font-weight:900;color:var(--blue)}
.stat-card .lbl{font-size:.82rem;color:var(--mid);margin-top:4px}
/* ── 搜尋框 ── */
.search-input{padding:8px 14px;border:2px solid #e2e8f0;border-radius:8px;
  font-size:.88rem;width:200px;outline:none}
.search-input:focus{border-color:var(--blue)}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .admin-header h1 span{display:none}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════
     登入畫面
══════════════════════════════════ -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div style="font-size:2.5rem;margin-bottom:12px">🌊</div>
    <h2>潮旅國際旅行社</h2>
    <p>管理後台 — 請輸入管理員密鑰</p>
    <input class="login-input" type="password" id="login-key" placeholder="輸入 ADMIN_KEY" />
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px"
      onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> 登入</button>
    <p id="login-err" style="color:#e53e3e;font-size:.82rem;margin-top:8px;display:none">
      密鑰錯誤，請重試</p>
  </div>
</div>

<!-- ══════════════════════════════════
     管理介面（登入後顯示）
══════════════════════════════════ -->
<div id="admin-app" style="display:none">
  <header class="admin-header">
    <h1><i class="fas fa-water"></i> <span>潮旅國際旅行社</span> 管理後台</h1>
    <div class="header-actions">
      <a href="/" target="_blank" class="btn btn-ghost btn-sm">
        <i class="fas fa-external-link-alt"></i> 前往網站
      </a>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">
        <i class="fas fa-sign-out-alt"></i> 登出
      </button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="active" onclick="switchTab('tours',this)">
      <i class="fas fa-map-marked-alt"></i> 行程管理
    </button>
    <button onclick="switchTab('slots',this)">
      <i class="fas fa-calendar-check"></i> 梯次名額
    </button>
    <button onclick="switchTab('posts',this)">
      <i class="fas fa-pen-nib"></i> 部落格
    </button>
    <button onclick="switchTab('neihai',this)">
      <i class="fas fa-ship"></i> 內海預購
    </button>
    <button onclick="switchTab('contacts',this)">
      <i class="fas fa-envelope"></i> 諮詢紀錄
    </button>
  </nav>

  <div class="admin-body">

    <!-- ── 行程管理 ── -->
    <div class="tab-content active" id="tab-tours">
      <div class="toolbar">
        <h2>行程列表</h2>
        <div class="toolbar-right">
          <input class="search-input" type="text" id="tour-search"
            placeholder="🔍 搜尋行程名稱" oninput="filterTours()" />
          <button class="btn btn-primary" onclick="openTourForm()">
            <i class="fas fa-plus"></i> 新增行程
          </button>
        </div>
      </div>

      <div id="tour-stats" class="stats-row"></div>

      <table class="tour-table" id="tour-table">
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th>行程名稱</th>
            <th>顯示分類</th>
            <th>天數</th>
            <th>價格</th>
            <th>狀態</th>
            <th style="width:120px">操作</th>
          </tr>
        </thead>
        <tbody id="tour-tbody">
          <tr><td colspan="7" style="text-align:center;padding:30px;color:#a0aec0">
            載入中…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ── 梯次名額 ── -->
    <div class="tab-content" id="tab-slots">
      <div class="toolbar">
        <h2>梯次名額管理</h2>
        <button class="btn btn-primary" onclick="openSlotForm()">
          <i class="fas fa-plus"></i> 新增梯次
        </button>
      </div>
      <div id="slots-list">載入中…</div>
    </div>

    <!-- ── 部落格 ── -->
    <div class="tab-content" id="tab-posts">
      <div class="toolbar">
        <h2>部落格文章</h2>
        <button class="btn btn-primary" onclick="openPostForm()">
          <i class="fas fa-plus"></i> 寫新文章
        </button>
      </div>
      <div id="posts-list">載入中…</div>
    </div>


    <!-- ── 小城故事・內海巡禮預購 ── -->
    <div class="tab-content" id="tab-neihai">
      <div class="toolbar">
        <h2>小城故事・內海巡禮預購訂單</h2>
        <div class="toolbar-right">
          <input type="month" id="neihai-month" class="search-input" style="width:160px" />
          <button class="btn btn-primary" onclick="loadNeihaiOrders()">
            <i class="fas fa-sync"></i> 載入月份
          </button>
          <a class="btn btn-ghost" href="/neihai-preorder.html" target="_blank">
            <i class="fas fa-up-right-from-square"></i> 開啟預購頁
          </a>
        </div>
      </div>
      <div id="neihai-stats" class="stats-row"></div>
      <div id="neihai-orders-list">請選擇月份後載入…</div>
    </div>

    <!-- ── 諮詢紀錄 ── -->
    <div class="tab-content" id="tab-contacts">
      <div class="toolbar">
        <h2>諮詢紀錄</h2>
        <button class="btn btn-primary" onclick="loadContacts()">
          <i class="fas fa-sync"></i> 重新整理
        </button>
      </div>
      <div id="contacts-list">載入中…</div>
    </div>
  </div>
</div>

<!-- ── 部落格文章編輯彈窗 ── -->
<div class="modal-bg" id="post-modal">
  <div class="modal-box" style="max-width:760px">
    <div class="modal-head">
      <h3 id="post-modal-title">寫新文章</h3>
      <button class="btn btn-ghost btn-sm" onclick="closePostModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body-inner">
      <input type="hidden" id="p-id" />
      <div class="form-group full">
        <label>標題 *</label>
        <input id="p-title" placeholder="例：澎湖三天兩夜這樣玩最順" oninput="autoSlug()" />
      </div>
      <div class="form-group full">
        <label>網址代稱 slug（英數與 - ，會成為 /blog/<b>slug</b>）</label>
        <input id="p-slug" placeholder="penghu-3day-itinerary" />
      </div>
      <div class="form-group full">
        <label>摘要（列表與搜尋預覽顯示，約 60–120 字）</label>
        <textarea id="p-summary" rows="2" placeholder="一句話介紹這篇文章…"></textarea>
      </div>
      <div class="form-group full">
        <label>封面圖（選填）</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <input type="file" id="p-cover-file" accept="image/*" style="display:none" onchange="handleCoverUpload(this)" />
          <button type="button" class="btn btn-sm btn-primary" onclick="document.getElementById('p-cover-file').click()">
            <i class="fas fa-image"></i> 選擇圖片上傳
          </button>
          <button type="button" class="btn btn-sm btn-ghost" onclick="clearCover()">清除</button>
          <span id="cover-status" style="font-size:.82rem;color:#718096"></span>
        </div>
        <img id="cover-preview" style="display:none;max-width:240px;max-height:150px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:8px" />
        <input id="p-cover" placeholder="也可直接貼圖片網址 https://...jpg" oninput="syncCoverPreview()" style="font-size:.85rem" />
        <p style="font-size:.78rem;color:#a0aec0;margin-top:4px">上傳的圖片會自動縮圖、壓縮並存進資料庫，免擔心尺寸與部署消失問題。</p>
      </div>
      <div class="form-group full">
        <label>內文（可用基本 HTML：<code>&lt;h2&gt; &lt;p&gt; &lt;strong&gt; &lt;ul&gt;&lt;li&gt; &lt;img&gt; &lt;a&gt;</code>；
          直接打字、空一行分段也可，存檔會自動轉段落）</label>
        <textarea id="p-content" rows="12" placeholder="在這裡寫文章內容…&#10;&#10;空一行就會自動分成新段落。"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group">
          <label>標籤（逗號分隔）</label>
          <input id="p-tags" placeholder="景點,攻略,親子" />
        </div>
        <div class="form-group">
          <label>發布狀態</label>
          <select id="p-pub">
            <option value="false">草稿（不公開）</option>
            <option value="true">發布（公開於部落格）</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:18px">
        <button class="btn btn-ghost" onclick="closePostModal()">取消</button>
        <button class="btn btn-primary" onclick="savePost()"><i class="fas fa-save"></i> 儲存文章</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     行程新增 / 編輯 Modal
══════════════════════════════════ -->
<div class="modal-bg" id="tour-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">新增行程</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeTourModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body-inner">
      <input type="hidden" id="f-id" />

      <!-- 基本資訊 -->
      <div class="form-section">基本資訊</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>行程名稱 *</label>
          <input type="text" id="f-title" placeholder="例：澎湖經典三日遊" />
        </div>
        <div class="form-group full">
          <label>簡介說明</label>
          <textarea id="f-desc" placeholder="一到兩句描述這個行程的特色"></textarea>
        </div>
        <div class="form-group full">
          <label>封面圖片 URL</label>
          <input type="url" id="f-image" placeholder="https://..." oninput="previewImg()" />
          <img id="img-preview" class="img-preview" alt="預覽" />
        </div>
      </div>

      <!-- 分類設定 -->
      <div class="form-section">顯示分類（可多選）</div>
      <div class="checkbox-group" id="f-tabs-group">
        <div style="width:100%;font-weight:700;color:#1a6b9e;margin:2px 0;">📦 套裝行程</div>
        <label class="checkbox-label"><input type="checkbox" value="featured" /> ⭐ 官方合作特色行程</label>
        <label class="checkbox-label"><input type="checkbox" value="2d1n" /> ☀ 兩天一夜</label>
        <label class="checkbox-label"><input type="checkbox" value="3d2n" /> 🏖 三天兩夜</label>
        <label class="checkbox-label"><input type="checkbox" value="4d3n" /> 🚢 四天三夜</label>
        <div style="width:100%;font-weight:700;color:#1a6b9e;margin:8px 0 2px;">🌊 單一行程（依海域）</div>
        <label class="checkbox-label"><input type="checkbox" value="north-sea" /> 北海海域</label>
        <label class="checkbox-label"><input type="checkbox" value="east-sea" /> 東海海域</label>
        <label class="checkbox-label"><input type="checkbox" value="south-sea" /> 南海海域</label>
        <label class="checkbox-label"><input type="checkbox" value="main-island" /> 本島海域</label>
      </div>

      <!-- 標籤與天數 -->
      <div class="form-section">卡片標籤與規格</div>
      <div class="form-grid">
        <div class="form-group">
          <label>角標文字</label>
          <input type="text" id="f-badge-text" placeholder="例：最受歡迎" />
        </div>
        <div class="form-group">
          <label>角標樣式</label>
          <select id="f-badge-class">
            <option value="">（無角標）</option>
            <option value="popular">🔴 最受歡迎</option>
            <option value="family">🟠 親子首選</option>
            <option value="eco">🟢 生態特色</option>
            <option value="adventure">🟣 冒險首選</option>
            <option value="badge-2026">🔥 2026 主打</option>
          </select>
        </div>
        <div class="form-group">
          <label>適合對象</label>

          <label>主打卡片樣式（多出發地）</label>

      <!-- 多出發地價格（主打行程用） -->
      <div class="form-section">多出發地價格（主打行程）</div>
      <div id="prices-container" class="price-rows"></div>
      <button class="btn btn-ghost btn-sm" onclick="addPriceRow()" style="margin-top:6px">

      <!-- Modal 詳細內容 -->
      <div class="form-section">查看詳情 Modal 內容</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>行程亮點（每行一條）</label>
          <textarea id="f-highlights" rows="5"
            placeholder="🐢 走進海龜的家&#10;🤿 浮潛 × 珊瑚礁&#10;🏡 花宅深度走讀"></textarea>
        </div>
        <div class="form-group full">
          <label>出發日期（每行一個梯次，空白則不顯示）</label>
          <textarea id="f-dates" rows="4"
            placeholder="6/12（五）－ 6/15（一）&#10;6/26（五）－ 6/29（一）"></textarea>
        </div>
        <div class="form-group full">
          <label>費用包含</label>
          <textarea id="f-includes" rows="2"
            placeholder="住宿2晚、每日早餐、景點門票、專業導遊…"></textarea>
        </div>
        <div class="form-group full">
          <label>注意事項</label>
          <textarea id="f-notes" rows="2"
            placeholder="機票/船票需自行購買，行程依天候調整…"></textarea>
        </div>
        <div class="form-group full">
          <label>行程規劃（Day 1~N，每天格式：<br>
            <code>DAY 1|抵達澎湖 × 海島開場|抵達澎湖;市區觀光;晚餐自理</code>
            ，每天一行）</label>
          <textarea id="f-days" rows="6"
            placeholder="DAY 1|抵達澎湖 × 海島開場|抵達澎湖;市區觀光;晚餐自理&#10;DAY 2|望安深度探索|搭船前往望安;浮潛體驗;在地晚餐"></textarea>
        </div>
      </div>

      <!-- ── 多語翻譯編輯 ── -->
      <div class="form-group full" style="border-top:2px dashed #cbd5e0;padding-top:16px;margin-top:8px">
        <label style="font-weight:700;color:#1a6b9e">
          <i class="fas fa-language"></i> 多語翻譯（選填，留空的語言／欄位會自動顯示中文）
        </label>
        <div style="display:flex;gap:6px;margin:10px 0;flex-wrap:wrap">
          <button type="button" class="btn btn-sm btn-ghost i18n-lang-btn" data-lang="en" onclick="switchI18nLang('en')">English</button>
          <button type="button" class="btn btn-sm btn-ghost i18n-lang-btn" data-lang="ja" onclick="switchI18nLang('ja')">日本語</button>
          <button type="button" class="btn btn-sm btn-ghost i18n-lang-btn" data-lang="ko" onclick="switchI18nLang('ko')">한국어</button>
          <button type="button" class="btn btn-sm btn-ghost i18n-lang-btn" data-lang="zh-cn" onclick="switchI18nLang('zh-cn')">简体</button>
          <span id="i18n-cur-label" style="margin-left:8px;align-self:center;font-size:.85rem;color:#4a5568"></span>
        </div>
        <input id="fi-title" placeholder="行程名稱（翻譯）" style="width:100%;margin-bottom:6px;padding:7px;border:1px solid #e2e8f0;border-radius:6px" />
        <textarea id="fi-desc" rows="2" placeholder="描述（翻譯）" style="width:100%;margin-bottom:6px;padding:7px;border:1px solid #e2e8f0;border-radius:6px"></textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px">
          <input id="fi-suitable" placeholder="適合對象（翻譯）" style="padding:7px;border:1px solid #e2e8f0;border-radius:6px" />
          <input id="fi-duration" placeholder="天數（翻譯）" style="padding:7px;border:1px solid #e2e8f0;border-radius:6px" />
          <input id="fi-price" placeholder="價格（翻譯）" style="padding:7px;border:1px solid #e2e8f0;border-radius:6px" />
        </div>
        <textarea id="fi-highlights" rows="3" placeholder="行程亮點（翻譯，每行一項）" style="width:100%;margin-bottom:6px;padding:7px;border:1px solid #e2e8f0;border-radius:6px"></textarea>
        <textarea id="fi-dates" rows="2" placeholder="出發日期（翻譯，每行一項）" style="width:100%;margin-bottom:6px;padding:7px;border:1px solid #e2e8f0;border-radius:6px"></textarea>
        <textarea id="fi-days" rows="4" placeholder="行程規劃（翻譯，格式：DAY 1|標題|項目1;項目2，每天一行）" style="width:100%;margin-bottom:6px;padding:7px;border:1px solid #e2e8f0;border-radius:6px"></textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <input id="fi-includes" placeholder="費用包含（翻譯）" style="padding:7px;border:1px solid #e2e8f0;border-radius:6px" />
          <input id="fi-notes" placeholder="備註（翻譯）" style="padding:7px;border:1px solid #e2e8f0;border-radius:6px" />
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px">
        <button class="btn btn-ghost" onclick="closeTourModal()">取消</button>
        <button class="btn btn-primary" onclick="saveTour()">
          <i class="fas fa-save"></i> 儲存行程
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast 通知 -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════
   全域狀態
══════════════════════════════════════ */
let ADMIN_KEY = '';
let allTours  = [];

/* ══════════════════════════════════════
   多語翻譯編輯
══════════════════════════════════════ */
let _i18nDraft   = {};       // { en:{...}, ja:{...}, ko:{...}, 'zh-cn':{...} }
let _i18nCurLang = 'en';
const I18N_LANGS = ['en','ja','ko','zh-cn'];
const I18N_NAMES = { en:'English', ja:'日本語', ko:'한국어', 'zh-cn':'简体中文' };

function _fiVal(id){ return document.getElementById(id).value; }
function _fiSet(id,v){ document.getElementById(id).value = v || ''; }

// 從畫面欄位讀出當前語言的翻譯物件
function collectI18nFields(){
  const md = {};
  const hl = _fiVal('fi-highlights').split('\n').map(s=>s.trim()).filter(Boolean);
  const dt = _fiVal('fi-dates').split('\n').map(s=>s.trim()).filter(Boolean);
  const daysRaw = _fiVal('fi-days').split('\n').map(s=>s.trim()).filter(Boolean);
  const days = daysRaw.map(line=>{
    const [label,title,items] = line.split('|');
    return { label:(label||'').trim(), title:(title||'').trim(),
             items:(items||'').split(';').map(s=>s.trim()).filter(Boolean) };
  });
  const inc = _fiVal('fi-includes').trim();
  const nt  = _fiVal('fi-notes').trim();
  if (hl.length)  md.highlights = hl;
  if (dt.length)  md.dates = dt;
  if (days.length) md.days = days;
  if (inc) md.includes = inc;
  if (nt)  md.notes = nt;
  const obj = {};
  const title = _fiVal('fi-title').trim();
  const desc  = _fiVal('fi-desc').trim();
  const suit  = _fiVal('fi-suitable').trim();
  const dur   = _fiVal('fi-duration').trim();
  const price = _fiVal('fi-price').trim();
  if (title) obj.title = title;
  if (desc)  obj.description = desc;
  if (suit)  obj.suitable_for = suit;
  if (dur)   obj.duration = dur;
  if (price) obj.price_display = price;
  if (Object.keys(md).length) obj.modal_data = md;
  return obj;
}

// 把翻譯物件填回畫面欄位
function loadI18nFields(obj){
  obj = obj || {};
  _fiSet('fi-title', obj.title);
  _fiSet('fi-desc', obj.description);
  _fiSet('fi-suitable', obj.suitable_for);
  _fiSet('fi-duration', obj.duration);
  _fiSet('fi-price', obj.price_display);
  const md = obj.modal_data || {};
  _fiSet('fi-highlights', (md.highlights||[]).join('\n'));
  _fiSet('fi-dates', (md.dates||[]).join('\n'));
  _fiSet('fi-days', (md.days||[]).map(d=>`${d.label}|${d.title}|${(d.items||[]).join(';')}`).join('\n'));
  _fiSet('fi-includes', md.includes);
  _fiSet('fi-notes', md.notes);
}

// 切換編輯語言（先存當前，再載入目標語言）
function switchI18nLang(lang){
  _i18nDraft[_i18nCurLang] = collectI18nFields();
  _i18nCurLang = lang;
  loadI18nFields(_i18nDraft[lang]);
  document.querySelectorAll('.i18n-lang-btn').forEach(b=>{
    b.classList.toggle('btn-primary', b.dataset.lang===lang);
    b.classList.toggle('btn-ghost', b.dataset.lang!==lang);
  });
  document.getElementById('i18n-cur-label').textContent = '正在編輯：' + I18N_NAMES[lang];
}

// 初始化編輯器（編輯或新增時呼叫）
function initI18nEditor(i18n){
  _i18nDraft = JSON.parse(JSON.stringify(i18n || {}));
  _i18nCurLang = 'en';
  loadI18nFields(_i18nDraft.en);
  document.querySelectorAll('.i18n-lang-btn').forEach(b=>{
    b.classList.toggle('btn-primary', b.dataset.lang==='en');
    b.classList.toggle('btn-ghost', b.dataset.lang!=='en');
  });
  document.getElementById('i18n-cur-label').textContent = '正在編輯：English';
}

// 取得最終 i18n（過濾空語言）
function buildI18nPayload(){
  _i18nDraft[_i18nCurLang] = collectI18nFields();
  const out = {};
  I18N_LANGS.forEach(l=>{
    const o = _i18nDraft[l];
    if (o && Object.keys(o).length) out[l] = o;
  });
  return out;
}

/* ══════════════════════════════════════
   登入 / 登出
══════════════════════════════════════ */
function doLogin() {
  const key = document.getElementById('login-key').value.trim();
  if (!key) return;
  // 先用 /api/admin/tours?key=xxx 驗證
  fetch(`/api/admin/tours?key=${encodeURIComponent(key)}`)
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        ADMIN_KEY = key;
        sessionStorage.setItem('admin_key', key);
        showAdmin();
      } else {
        document.getElementById('login-err').style.display = 'block';
      }
    })
    .catch(() => { document.getElementById('login-err').style.display = 'block'; });
}
function doLogout() {
  sessionStorage.removeItem('admin_key');
  location.reload();
}
function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  loadTours();
}
// 頁面載入：嘗試從 sessionStorage 恢復登入
(function() {
  const k = sessionStorage.getItem('admin_key');
  if (k) { ADMIN_KEY = k; showAdmin(); }
})();
// Enter 鍵登入
document.getElementById('login-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

/* ══════════════════════════════════════
   Tab 切換
══════════════════════════════════════ */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  btn.classList.add('active');
  if (name === 'contacts') loadContacts();
  if (name === 'slots')    loadSlots();
  if (name === 'posts')    loadPosts();
  if (name === 'neihai')   loadNeihaiOrders();
}

/* ══════════════════════════════════════
   行程 CRUD
══════════════════════════════════════ */
function loadTours() {
  fetch(`/api/admin/tours?key=${encodeURIComponent(ADMIN_KEY)}`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      allTours = d.tours;
      renderTourTable(allTours);
      renderStats(allTours);
    });
}

function renderStats(tours) {
  const active = tours.filter(t => t.is_active).length;
  document.getElementById('tour-stats').innerHTML = `
    <div class="stat-card"><div class="num">${tours.length}</div><div class="lbl">全部行程</div></div>
    <div class="stat-card"><div class="num">${active}</div><div class="lbl">啟用中</div></div>
    <div class="stat-card"><div class="num">${tours.length - active}</div><div class="lbl">已停用</div></div>`;
}

// tab 名稱對應
const TAB_NAMES = { featured:'特色行程', '2d1n':'兩天一夜', '3d2n':'三天兩夜', '4d3n':'四天三夜',
                    'north-sea':'北海海域', 'east-sea':'東海海域', 'south-sea':'南海海域', 'main-island':'本島海域' };

function renderTourTable(tours) {
  const tbody = document.getElementById('tour-tbody');
  if (!tours.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#a0aec0">尚無行程</td></tr>';
    return;
  }
  tbody.innerHTML = tours.map(t => `
    <tr>
      <td><span class="drag-handle" title="排序">⠿</span> ${t.sort_order}</td>
      <td>
        <strong>${t.title}</strong>
        ${t.badge_text ? `<span class="tab-chip">${t.badge_text}</span>` : ''}
      </td>
      <td>${(t.tabs||['featured']).map(tb=>`<span class="tab-chip">${TAB_NAMES[tb]||tb}</span>`).join('')}</td>
      <td>${t.duration||'—'}</td>
      <td>${t.price_display||'—'}</td>
      <td>
        <label class="toggle-wrap" onclick="toggleActive(${t.id},${t.is_active})">
          <input type="checkbox" ${t.is_active?'checked':''} />
          <div class="toggle-track"></div>
          <span class="toggle-label">${t.is_active?'顯示':'隱藏'}</span>
        </label>
      </td>
      <td style="display:flex;gap:4px">
        <button class="btn btn-warning btn-sm" onclick="editTour(${t.id})">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn btn-danger btn-sm" onclick="deleteTour(${t.id},'${t.title.replace(/'/g,"\\'")}')">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </tr>`).join('');
}

function filterTours() {
  const q = document.getElementById('tour-search').value.toLowerCase();
  renderTourTable(allTours.filter(t => t.title.toLowerCase().includes(q)));
}

/* ── 快速切換前台顯示 ── */
async function toggleActive(id, current) {
  const tour = allTours.find(t => t.id === id);
  if (!tour) return;
  const newVal = !current;
  try {
    const res = await fetch(`/api/admin/tours/${id}?key=${encodeURIComponent(ADMIN_KEY)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...tour, is_active: newVal, _key: ADMIN_KEY })
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error);
    tour.is_active = newVal;
    renderTourTable(allTours);
    renderStats(allTours);
    showToast(`「${tour.title}」已${newVal ? '顯示在前台' : '從前台隱藏'}`, newVal ? 'success' : 'warning');
  } catch (e) {
    showToast('切換失敗：' + e.message, 'error');
  }
}

/* ── 開啟新增表單 ── */
function openTourForm() {
  document.getElementById('modal-title').textContent = '新增行程';
  document.getElementById('f-id').value = '';
  resetForm();
  document.getElementById('tour-modal').classList.add('open');
}

/* ── 編輯行程 ── */
function editTour(id) {
  const t = allTours.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modal-title').textContent = '編輯行程';
  document.getElementById('f-id').value = id;

  document.getElementById('f-title').value      = t.title || '';
  document.getElementById('f-desc').value       = t.description || '';
  document.getElementById('f-image').value      = t.image_url || '';
  document.getElementById('f-badge-text').value = t.badge_text || '';
  document.getElementById('f-badge-class').value= t.badge_class || '';
  document.getElementById('f-suitable').value   = t.suitable_for || '';
  document.getElementById('f-duration').value   = t.duration || '';
  document.getElementById('f-price').value      = t.price_display || '';
  document.getElementById('f-sort').value       = t.sort_order ?? 99;
  document.getElementById('f-active').value     = String(t.is_active !== false);
  document.getElementById('f-hero').value       = String(!!t.is_hero);

  // tabs checkboxes
  document.querySelectorAll('#f-tabs-group input').forEach(cb => {
    cb.checked = (t.tabs||[]).includes(cb.value);
  });

  // prices
  renderPriceInputs(t.prices || []);

  // modal_data
  const md = t.modal_data || {};
  document.getElementById('f-highlights').value =
    (md.highlights || []).join('\n');
  document.getElementById('f-dates').value =
    (md.dates || []).join('\n');
  document.getElementById('f-includes').value = md.includes || '';
  document.getElementById('f-notes').value    = md.notes || '';

  // days: format as "DAY 1|Title|item1;item2"
  document.getElementById('f-days').value =
    (md.days || []).map(d =>
      `${d.label}|${d.title}|${(d.items||[]).join(';')}`
    ).join('\n');

  // 多語翻譯
  initI18nEditor(t.i18n);

  previewImg();
  document.getElementById('tour-modal').classList.add('open');
}

/* ── 重置表單 ── */
function resetForm() {
  ['f-title','f-desc','f-image','f-badge-text','f-suitable',
   'f-duration','f-price','f-highlights','f-dates','f-includes','f-notes','f-days']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-sort').value      = '99';
  document.getElementById('f-active').value    = 'true';
  document.getElementById('f-hero').value      = 'false';
  document.getElementById('f-badge-class').value = '';
  document.querySelectorAll('#f-tabs-group input').forEach(cb => cb.checked = false);
  document.getElementById('prices-container').innerHTML = '';
  document.getElementById('img-preview').style.display = 'none';
  // 清空多語翻譯編輯器
  initI18nEditor({});
}

/* ── 關閉 Modal ── */
function closeTourModal() {
  document.getElementById('tour-modal').classList.remove('open');
}

/* ── 儲存行程 ── */
function saveTour() {
  const id    = document.getElementById('f-id').value;
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('請輸入行程名稱', 'error'); return; }

  const tabs = Array.from(document.querySelectorAll('#f-tabs-group input:checked'))
                    .map(cb => cb.value);
  if (!tabs.length) { showToast('請至少選一個顯示分類', 'error'); return; }

  // 解析 prices
  const priceInputs = document.querySelectorAll('.price-row-input');
  const prices = Array.from(priceInputs).map(row => ({
    label: row.querySelector('.p-label').value.trim(),
    value: row.querySelector('.p-value').value.trim(),
  })).filter(p => p.label || p.value);

  // 解析 modal_data
  const highlights = document.getElementById('f-highlights').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const dates = document.getElementById('f-dates').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const daysRaw = document.getElementById('f-days').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const days = daysRaw.map(line => {
    const [label, titlePart, itemsPart] = line.split('|');
    return {
      label: label?.trim() || '',
      title: titlePart?.trim() || '',
      items: (itemsPart || '').split(';').map(s => s.trim()).filter(Boolean),
    };
  });

  const payload = {
    tabs,
    badge_text:   document.getElementById('f-badge-text').value.trim(),
    badge_class:  document.getElementById('f-badge-class').value,
    image_url:    document.getElementById('f-image').value.trim(),
    title,
    description:  document.getElementById('f-desc').value.trim(),
    suitable_for: document.getElementById('f-suitable').value.trim(),
    duration:     document.getElementById('f-duration').value.trim(),
    price_display:document.getElementById('f-price').value.trim(),
    is_hero:      document.getElementById('f-hero').value === 'true',
    prices,
    modal_data: {
      highlights, dates, days,
      includes: document.getElementById('f-includes').value.trim(),
      notes:    document.getElementById('f-notes').value.trim(),
    },
    sort_order: parseInt(document.getElementById('f-sort').value) || 99,
    is_active:  document.getElementById('f-active').value === 'true',
    i18n:       buildI18nPayload(),
    _key: ADMIN_KEY,
  };

  const url    = id ? `/api/admin/tours/${id}` : '/api/admin/tours';
  const method = id ? 'PUT' : 'POST';

  fetch(`${url}?key=${encodeURIComponent(ADMIN_KEY)}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(r => r.json())
    .then(d => {

        closeTourModal();
        loadTours();

    });
}

   小城故事・內海巡禮預購訂單
══════════════════════════════════════ */
function neihaiMonthDefault() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function statusText(status) {
  return {
    pending_departure: '待成團',
    confirmed_departure: '已達發船門檻',
    confirmed: '人工確認',
    cancelled: '已取消',
  }[status] || status || '—';
}

function orderStatusColor(status) {
  return status === 'cancelled' ? '#c53030'
    : status === 'confirmed' || status === 'confirmed_departure' ? '#2f855a'
    : '#b7791f';
}

function loadNeihaiOrders() {
  const monthEl = document.getElementById('neihai-month');
  if (monthEl && !monthEl.value) monthEl.value = neihaiMonthDefault();
  const month = monthEl ? monthEl.value : neihaiMonthDefault();
  const list = document.getElementById('neihai-orders-list');
  list.innerHTML = '載入中…';
  fetch(`/api/admin/neihai/preorders?month=${encodeURIComponent(month)}&key=${encodeURIComponent(ADMIN_KEY)}`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { list.innerHTML = d.error || '載入失敗'; return; }
      const activeOrders = d.orders.filter(o => o.status !== 'cancelled');
      const pax = activeOrders.reduce((sum, o) => sum + (parseInt(o.passenger_count, 10) || 0), 0);
      const guaranteed = d.sailings.filter(s => s.status === 'guaranteed').length;
      const forming = d.sailings.filter(s => s.status === 'forming' && s.booked > 0).length;
      document.getElementById('neihai-stats').innerHTML = `
        <div class="stat-card"><div class="num">${d.orders.length}</div><div class="lbl">本月訂單</div></div>
        <div class="stat-card"><div class="num">${pax}</div><div class="lbl">有效預購人數</div></div>
        <div class="stat-card"><div class="num">${guaranteed}</div><div class="lbl">已達發船船班</div></div>
        <div class="stat-card"><div class="num">${forming}</div><div class="lbl">待成團船班</div></div>`;
      if (!d.orders.length) {
        list.innerHTML = '<p style="color:#a0aec0;text-align:center;padding:40px">本月尚無預購訂單</p>';
        return;
      }
      list.innerHTML = d.orders.map(o => `
        <div class="contact-card" style="display:block">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
            <div>
              <strong style="font-size:1.05rem;color:var(--blue-dk)">${o.booking_ref || '未編號'}</strong>
              <div style="color:var(--mid);font-size:.9rem">${o.sailing_date} ${o.sailing_time}｜${o.passenger_count} 人｜業者：${o.agency_name || '—'}</div>
            </div>
            <div>
              <span style="font-weight:800;color:${orderStatusColor(o.status)}">${statusText(o.status)}</span>
              <select onchange="updateNeihaiOrderStatus(${o.id}, this.value)" style="margin-left:8px;padding:6px;border:1px solid #e2e8f0;border-radius:6px">
                ${['pending_departure','confirmed_departure','confirmed','cancelled'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${statusText(s)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="contact-field"><label>主要聯絡</label><span>${o.contact_name}｜${o.contact_phone}</span></div>
          <div class="contact-field"><label>備註</label><span>${o.notes || '—'}</span></div>
          <table class="tour-table" style="margin-top:12px">
            <thead><tr><th>乘客</th><th>身分證字號</th><th>出生年月日</th><th>電話</th></tr></thead>
            <tbody>${(o.passengers || []).map(p => `<tr><td>${p.name}</td><td>${p.national_id}</td><td>${p.birth_date}</td><td>${p.phone}</td></tr>`).join('')}</tbody>
          </table>
        </div>`).join('');
    })
    .catch(() => { list.innerHTML = '載入失敗'; });
}

function updateNeihaiOrderStatus(id, status) {
  fetch(`/api/admin/neihai/preorders/${id}?key=${encodeURIComponent(ADMIN_KEY)}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ status, _key: ADMIN_KEY })
  }).then(r => r.json()).then(d => {
    if (d.ok) { showToast('狀態已更新', 'success'); loadNeihaiOrders(); }
    else showToast(d.error || '更新失敗', 'error');
  });
}

});

   梯次名額管理
══════════════════════════════════════ */
let _tourList = [];   // 行程清單（for 梯次表單下拉）

function loadSlots() {
  const el = document.getElementById('slots-list');
  el.innerHTML = '載入中…';

  // 同時抓行程清單（for 表單）和梯次清單
  Promise.all([
    fetch(`/api/admin/tours?key=${encodeURIComponent(ADMIN_KEY)}`).then(r => r.json()),
    fetch(`/api/admin/slots?key=${encodeURIComponent(ADMIN_KEY)}`).then(r => r.json()),
  ]).then(([toursData, slotsData]) => {
    if (toursData.ok) _tourList = toursData.tours;
    if (!slotsData.ok) { el.innerHTML = '載入失敗'; return; }

    const slots = slotsData.slots;
    if (!slots.length) {
      el.innerHTML = '<p style="color:#a0aec0;text-align:center;padding:40px">尚無梯次，請點「新增梯次」建立</p>';
      return;
    }

    // 依行程分組
    const groups = {};
    slots.forEach(s => {
      const tour = _tourList.find(t => t.id === s.tour_id);
      const name = tour ? tour.title : `行程 #${s.tour_id}`;
      if (!groups[name]) groups[name] = [];
      groups[name].push(s);
    });

    el.innerHTML = Object.entries(groups).map(([tourName, list]) => `
      <div style="margin-bottom:24px">
        <h3 style="font-size:.95rem;font-weight:700;color:#1a6b9e;margin-bottom:10px;
          padding:6px 12px;background:#e8f4fd;border-radius:6px">${tourName}</h3>
        <table class="tour-table" style="min-width:100%">
          <thead><tr>
            <th>梯次日期</th>
            <th>限量名額</th>
            <th>已報名</th>
            <th>候補上限</th>
            <th>已候補</th>
            <th>剩餘</th>
            <th>狀態</th>
            <th style="width:130px">操作</th>
          </tr></thead>
          <tbody>${list.map(s => {
            const statusBadge = s.remaining === 0 && s.wl_remaining === 0
              ? '<span style="color:#e53e3e;font-weight:700">⛔ 額滿</span>'
              : s.remaining === 0
              ? `<span style="color:#dd6b20;font-weight:700">🔴 候補 ${s.wl_remaining}位</span>`
              : s.remaining <= 3
              ? `<span style="color:#d69e2e;font-weight:700">🟡 緊張</span>`
              : `<span style="color:#38a169;font-weight:700">🟢 正常</span>`;
            const activeBtn = s.is_active
              ? `<button class="btn btn-sm btn-ghost" onclick="toggleSlot(${s.id},false)">下架</button>`
              : `<button class="btn btn-sm btn-success" onclick="toggleSlot(${s.id},true)">上架</button>`;
            const safeLabel = String(s.date_label).replace(/"/g, '&quot;');
            return `<tr style="${!s.is_active?'opacity:.5':''}">
              <td><input type="text" value="${safeLabel}" style="width:200px;font-weight:700"
                title="可直接修改梯次日期/名稱，離開欄位即儲存"
                onchange="patchSlot(${s.id},'date_label',this.value)" /></td>
              <td><input type="number" value="${s.capacity}" min="1" style="width:60px;text-align:center"
                onchange="patchSlot(${s.id},'capacity',this.value)" /></td>
              <td><input type="number" value="${s.booked}" min="0" style="width:60px;text-align:center"
                onchange="patchSlot(${s.id},'booked',this.value)" /></td>
              <td><input type="number" value="${s.waitlist_cap}" min="0" style="width:60px;text-align:center"
                onchange="patchSlot(${s.id},'waitlist_cap',this.value)" /></td>
              <td><input type="number" value="${s.waitlisted}" min="0" style="width:60px;text-align:center"
                onchange="patchSlot(${s.id},'waitlisted',this.value)" /></td>
              <td style="font-weight:700">${s.remaining}</td>
              <td>${statusBadge}</td>
              <td style="display:flex;gap:4px">
                ${activeBtn}
                <button class="btn btn-sm btn-danger" onclick="deleteSlot(${s.id})">刪除</button>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`).join('');
  });
}

// 文字欄位（不做 parseInt）
const SLOT_TEXT_FIELDS = ['date_label'];

function patchSlot(id, field, value) {
  // 文字欄位防呆：日期/名稱不可空白
  if (SLOT_TEXT_FIELDS.includes(field) && !String(value).trim()) {
    showToast('梯次日期不可空白', 'error');
    loadSlots();
    return;
  }
  // 找出該 slot 的完整資料再 PUT
  fetch(`/api/admin/slots?key=${encodeURIComponent(ADMIN_KEY)}`)
    .then(r => r.json())
    .then(d => {
      const slot = d.slots.find(s => s.id === id);
      if (!slot) return;
      slot[field] = SLOT_TEXT_FIELDS.includes(field)
        ? String(value).trim()
        : (parseInt(value) || 0);
      return fetch(`/api/admin/slots/${id}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
        body: JSON.stringify(slot)
      });
    })
    .then(r => r && r.ok ? showToast('已更新') : showToast('更新失敗','error'))
    .then(() => loadSlots())
    .catch(() => showToast('更新失敗','error'));
}

function toggleSlot(id, active) {
  fetch(`/api/admin/slots?key=${encodeURIComponent(ADMIN_KEY)}`)
    .then(r => r.json())
    .then(d => {
      const slot = d.slots.find(s => s.id === id);
      if (!slot) return;
      slot.is_active = active;
      return fetch(`/api/admin/slots/${id}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
        body: JSON.stringify(slot)
      });
    })
    .then(() => { showToast(active ? '已上架' : '已下架'); loadSlots(); })
    .catch(() => showToast('操作失敗','error'));
}

function deleteSlot(id) {
  if (!confirm('確定刪除此梯次？')) return;
  fetch(`/api/admin/slots/${id}`, {
    method:'DELETE', headers:{'X-Admin-Key':ADMIN_KEY}
  }).then(() => { showToast('已刪除'); loadSlots(); });
}

function submitSlotForm() {

function autoSlug() {
  const slugEl = document.getElementById('p-slug');
  if (slugEl.dataset.touched) return;
  const t = document.getElementById('p-title').value.trim();
  // 標題有英數時自動生成；中文標題請手動填 slug
  const s = t.toLowerCase().replace(/[^a-z0-9一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
  slugEl.value = s;
}

function openPostForm() {

function editPost(id) {
  const p = _allPosts.find(x => x.id === id);

  document.getElementById('post-modal-title').textContent = '編輯文章';
  document.getElementById('p-id').value = id;
  document.getElementById('p-title').value = p.title || '';
  document.getElementById('p-slug').value = p.slug || '';
  document.getElementById('p-slug').dataset.touched = '1';
  document.getElementById('p-summary').value = p.summary || '';
  document.getElementById('p-cover').value = p.cover_image || '';
  document.getElementById('p-content').value = p.content || '';
  document.getElementById('p-tags').value = p.tags || '';
  document.getElementById('p-pub').value = String(!!p.is_published);
  document.getElementById('cover-status').textContent = '';

  document.getElementById('post-modal').classList.add('open');
}

function closePostModal() { document.getElementById('post-modal').classList.remove('open'); }

// ── 封面圖：上傳 → 瀏覽器自動縮圖壓縮 → 存成 data URI ──
function handleCoverUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('請選擇圖片檔', 'error'); return; }
  const status = document.getElementById('cover-status');
  status.textContent = '處理中…';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;                         // 最長邊縮到 1200px
      let { width, height } = img;
      if (width > MAX || height > MAX) {
        if (width >= height) { height = Math.round(height * MAX / width); width = MAX; }
        else { width = Math.round(width * MAX / height); height = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      let q = 0.82, dataUri = canvas.toDataURL('image/jpeg', q);
      // 若仍偏大，逐步降品質（控制在約 ≤ 350KB）
      while (dataUri.length > 480000 && q > 0.45) { q -= 0.1; dataUri = canvas.toDataURL('image/jpeg', q); }
      document.getElementById('p-cover').value = dataUri;
      syncCoverPreview();
      const kb = Math.round(dataUri.length * 0.75 / 1024);
      status.textContent = `✅ 已縮圖 ${width}×${height}，約 ${kb} KB`;
    };
    img.onerror = () => { status.textContent = '圖片讀取失敗'; };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function clearCover() {
  document.getElementById('p-cover').value = '';
  document.getElementById('cover-status').textContent = '';
  syncCoverPreview();
}

function syncCoverPreview() {
  const v = document.getElementById('p-cover').value.trim();
  const prev = document.getElementById('cover-preview');
  if (v) { prev.src = v; prev.style.display = 'block'; }
  else { prev.removeAttribute('src'); prev.style.display = 'none'; }
}

// 純文字自動轉段落（若內容沒有 HTML 標籤）
function autoParagraph(txt) {
  if (/<[a-z][\s\S]*>/i.test(txt)) return txt; // 已含 HTML
  return txt.split(/\n{2,}/).map(b => b.trim()).filter(Boolean)
            .map(b => `<p>${b.replace(/\n/g,'<br>')}</p>`).join('\n');
}

function savePost() {
  const id    = document.getElementById('p-id').value;
  const title = document.getElementById('p-title').value.trim();
  let   slug  = document.getElementById('p-slug').value.trim();
  if (!title) { showToast('請輸入標題', 'error'); return; }
  if (!slug)  { showToast('請輸入網址代稱 slug', 'error'); return; }
  slug = slug.toLowerCase().replace(/[^a-z0-9一-龥-]+/g,'-').replace(/^-+|-+$/g,'');

  const payload = {
    title, slug,
    summary:    document.getElementById('p-summary').value.trim(),
    content:    autoParagraph(document.getElementById('p-content').value),
    cover_image:document.getElementById('p-cover').value.trim(),
    tags:       document.getElementById('p-tags').value.trim(),
    is_published: document.getElementById('p-pub').value === 'true',
    _key: ADMIN_KEY,
  };
  const url    = id ? `/api/admin/posts/${id}` : '/api/admin/posts';
  const method = id ? 'PUT' : 'POST';
  fetch(`${url}?key=${encodeURIComponent(ADMIN_KEY)}`, {
    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  }).then(r => r.json()).then(d => {
    if (d.ok) { showToast(id ? '文章已更新 ✅' : '文章已建立 ✅', 'success'); closePostModal(); loadPosts(); }
    else showToast('儲存失敗：' + (d.error||''), 'error');
  });
}

function deletePost(id, name) {
  if (!confirm(`確定刪除「${name}」？此操作無法復原。`)) return;
  fetch(`/api/admin/posts/${id}?key=${encodeURIComponent(ADMIN_KEY)}`, { method:'DELETE' })
    .then(r => r.json()).then(d => {
      if (d.ok) { showToast('文章已刪除', 'success'); loadPosts(); }
      else showToast('刪除失敗', 'error');
    });
}

// slug 手動編輯時標記，避免被自動覆蓋
document.addEventListener('DOMContentLoaded', () => {
  const s = document.getElementById('p-slug');
  if (s) s.addEventListener('input', () => { s.dataset.touched = '1'; });
});

/* ══════════════════════════════════════
   Toast 通知
══════════════════════════════════════ */
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2800);
}
