name: P1 weekly conversion report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 0" # 台灣時間週一 07:30

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "google-api-python-client>=2,<3" "google-auth>=2,<3"
      - name: Build GA4 funnel report
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/conversion_report.py --output conversion-report.json --markdown conversion-report.md
      - run: cat conversion-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p1-conversion-${{ github.run_id }}
          path: |
            conversion-report.json
            conversion-report.md
          retention-days: 90
